<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBONARIUM — Жива Павутина v3.1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #010105;
            --accent-a: #9d8aff;
            --accent-b: #ff5ab5;
            --accent-c: #00f2ff;
            --text-color: #d0c8ff;
            --glass: rgba(5, 2, 12, 0.85);
            --border: rgba(157, 138, 255, 0.2);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            color: var(--text-color);
            width: 220px;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #a78dff, #ff78d2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }

        .metric {
            padding: 4px 0;
            border-bottom: 1px solid rgba(157, 138, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .label {
            color: rgba(208, 200, 255, 0.5);
            font-size: 0.6rem;
            text-transform: uppercase;
        }

        .value {
            font-weight: 500;
            color: #fff;
            font-size: 0.85rem;
        }

        .influence-panel {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(157, 138, 255, 0.2);
        }

        .civ-bar-container {
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            margin: 8px 0;
            display: flex;
        }

        .civ-bar {
            height: 100%;
            transition: width 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bar-a {
            background: var(--accent-a);
            box-shadow: 0 0 10px var(--accent-a);
        }

        .bar-b {
            background: var(--accent-b);
            box-shadow: 0 0 10px var(--accent-b);
        }

        .bar-c {
            background: var(--accent-c);
            box-shadow: 0 0 10px var(--accent-c);
        }

        .civ-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            font-family: 'JetBrains Mono', monospace;
            opacity: 0.8;
        }

        .status-footer {
            margin-top: 15px;
            font-size: 0.6rem;
            color: rgba(208, 200, 255, 0.4);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sync-active {
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sync-active.error {
            color: #ef4444;
        }

        .sync-dot {
            width: 4px;
            height: 4px;
            background: currentColor;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.3;
                transform: scale(1.5);
            }
        }

        @media (max-width: 600px) {
            #ui {
                top: 15px;
                left: 15px;
                width: calc(100% - 30px);
                max-width: 180px;
            }

            h1 {
                font-size: 0.9rem;
            }

            .metric .value {
                font-size: 0.75rem;
            }

            .status-footer {
                font-size: 0.55rem;
            }
        }

        #proxy-warning {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 100, 100, 0.1);
            color: rgba(255, 128, 128, 0.8);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.65rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 100, 100, 0.2);
            display: none;
            z-index: 100;
            font-family: 'JetBrains Mono', monospace;
        }

        .uptime-container {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
            pointer-events: none;
        }

        .uptime-label {
            color: var(--accent-a);
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .uptime-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #fff;
            display: block;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div id="ui">
        <h1>
            <span>IBONARIUM</span>
            <span id="system-status" style="font-size: 0.5em; letter-spacing: 1px;">SYNCING</span>
        </h1>

        <div class="metrics-grid">
            <div class="metric">
                <span class="label">Kp Index</span>
                <span class="value" id="kp-val">--</span>
            </div>
            <div class="metric">
                <span class="label">Wind Speed</span>
                <span class="value" id="wind-val">--</span>
            </div>
            <div class="metric">
                <span class="label">Bz Field</span>
                <span class="value" id="bz-val">--</span>
            </div>
            <div class="metric">
                <span class="label">Density</span>
                <span class="value" id="dens-val">--</span>
            </div>
            <div class="metric">
                <span class="label">F10.7 Flux</span>
                <span class="value" id="f107-val">--</span>
            </div>
        </div>

        <div class="uptime-container">
            <span class="uptime-label">Система активована 31.01.2026</span>
            <span class="uptime-value" id="uptime-clock">0d 0h 0m 0s</span>
        </div>

        <div class="influence-panel">
            <div class="civ-info">
                <span style="color: var(--accent-a)">ORDER</span>
                <span style="color: var(--accent-b)">FLUX</span>
                <span style="color: var(--accent-c)">ETHER</span>
            </div>
            <div class="civ-bar-container">
                <div id="bar-a" class="civ-bar bar-a" style="width: 33%"></div>
                <div id="bar-b" class="civ-bar bar-b" style="width: 33%"></div>
                <div id="bar-c" class="civ-bar bar-c" style="width: 34%"></div>
            </div>
            <div class="civ-info" style="font-size: 0.65rem; opacity: 0.6;">
                <span id="stat-a">0.0%</span>
                <span id="stat-b">0.0%</span>
                <span id="stat-c">0.0%</span>
            </div>
        </div>

        <div class="status-footer">
            <div id="sync-indicator" class="sync-active">
                <div class="sync-dot"></div>
                <span id="sync-text">Connecting to NOAA...</span>
            </div>
            <div id="update-timer">Next update in: 60s</div>
            <div id="nodes-count">Nodes: 0 | Edges: 0</div>
        </div>
    </div>

    <div id="proxy-warning">
        NOAA API unavailable. Using simulated data.
    </div>

    <script>
        /**
         * IBONARIUM v3.1 — THE LIVING CONSTELLATION
         * Fixed: Direct NOAA API calls (no CORS proxy needed)
         * NOAA supports Access-Control-Allow-Origin: * on all endpoints.
         *
         * Data sources:
         *   Kp Index:   services.swpc.noaa.gov/products/noaa-planetary-k-index.json
         *   Solar Wind: services.swpc.noaa.gov/text/ace-swepam.txt
         *   Bz Field:   services.swpc.noaa.gov/text/ace-magnetometer.txt
         *   F10.7 Flux: services.swpc.noaa.gov/json/f107_cm_flux.json
         */

        const CONFIG = {
            baseNodeCount: 400,
            connectionDist: 150,
            baseSpeed: 0.06,
            friction: 0.992,
            updateInterval: 60000,   // 60s — NOAA data updates every ~5 min
            starScale: 1.0
        };

        /* ─── Weather System ─── */
        class WeatherSystem {
            constructor() {
                this.data = {
                    kp: 2.0,
                    wind: 380.0,
                    bz: 0.0,
                    density: 5.0,
                    f107: 120.0,
                    storm: 0,
                    nebula: 0
                };
                this.isSimulated = false;
                this.syncCount = 0;
                this.lastSyncError = null;
            }

            async sync() {
                try {
                    const [kpData, windData, magData, f107Data] = await Promise.allSettled([
                        this.fetchKp(),
                        this.fetchSolarWind(),
                        this.fetchMagneticField(),
                        this.fetchF107()
                    ]);

                    // Parse Kp
                    if (kpData.status === 'fulfilled' && kpData.value !== null) {
                        this.data.kp = kpData.value;
                    }

                    // Parse solar wind (density + speed)
                    if (windData.status === 'fulfilled' && windData.value !== null) {
                        this.data.density = windData.value.density;
                        this.data.wind = windData.value.speed;
                    }

                    // Parse Bz
                    if (magData.status === 'fulfilled' && magData.value !== null) {
                        this.data.bz = magData.value;
                    }

                    // Parse F10.7
                    if (f107Data.status === 'fulfilled' && f107Data.value !== null) {
                        this.data.f107 = f107Data.value;
                    }

                    this.isSimulated = false;
                    this.syncCount++;
                    this.lastSyncError = null;
                    document.getElementById('proxy-warning').style.display = 'none';

                    const indicator = document.getElementById('sync-indicator');
                    indicator.classList.remove('error');
                    document.getElementById('sync-text').textContent =
                        `NOAA Live Stream Active (#${this.syncCount})`;
                } catch (e) {
                    console.warn('NOAA sync failed, using simulation.', e);
                    this.isSimulated = true;
                    this.lastSyncError = e.message;
                    this.simulateWeather();
                    document.getElementById('proxy-warning').style.display = 'block';

                    const indicator = document.getElementById('sync-indicator');
                    indicator.classList.add('error');
                    document.getElementById('sync-text').textContent = 'Simulation mode';
                }

                this.calculateStorm();
                this.updateUI();
            }

            /* ── NOAA Fetchers ── */

            async fetchKp() {
                const url = 'https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json';
                const res = await fetch(url);
                if (!res.ok) throw new Error(`Kp HTTP ${res.status}`);
                const json = await res.json();
                // Format: [{"time_tag":"...","Kp":2.33,"a_running":9,"station_count":8}, ...]
                const last = json[json.length - 1];
                const val = parseFloat(last.Kp);
                return isNaN(val) ? null : val;
            }

            async fetchSolarWind() {
                const url = 'https://services.swpc.noaa.gov/text/ace-swepam.txt';
                const res = await fetch(url);
                if (!res.ok) throw new Error(`SWEPAM HTTP ${res.status}`);
                const text = await res.text();
                const lines = text.trim().split('\n');

                // Parse from the end, skip lines with status=9 (no data) or -9999.9 values
                for (let i = lines.length - 1; i >= Math.max(0, lines.length - 50); i--) {
                    const line = lines[i].trim();
                    if (!line || line.startsWith('#') || line.startsWith(':')) continue;

                    const parts = line.split(/\s+/);
                    // Format: yr mo day hr min epoch status density speed temp
                    if (parts.length >= 9) {
                        const status = parseInt(parts[6]);
                        const density = parseFloat(parts[7]);
                        const speed = parseFloat(parts[8]);
                        if (status <= 8 && density > 0 && speed > 0) {
                            return { density, speed };
                        }
                    }
                }
                return null;
            }

            async fetchMagneticField() {
                const url = 'https://services.swpc.noaa.gov/text/ace-magnetometer.txt';
                const res = await fetch(url);
                if (!res.ok) throw new Error(`MAG HTTP ${res.status}`);
                const text = await res.text();
                const lines = text.trim().split('\n');

                for (let i = lines.length - 1; i >= Math.max(0, lines.length - 50); i--) {
                    const line = lines[i].trim();
                    if (!line || line.startsWith('#') || line.startsWith(':')) continue;

                    const parts = line.split(/\s+/);
                    // Format: yr mo day hr min epoch status Bx By Bz Bt lat lon
                    if (parts.length >= 12) {
                        const status = parseInt(parts[6]);
                        const bz = parseFloat(parts[9]);
                        if (status <= 8 && bz > -9000) {
                            return bz;
                        }
                    }
                }
                return null;
            }

            async fetchF107() {
                const url = 'https://services.swpc.noaa.gov/json/f107_cm_flux.json';
                const res = await fetch(url);
                if (!res.ok) throw new Error(`F107 HTTP ${res.status}`);
                const json = await res.json();
                const last = json[json.length - 1];
                const val = parseFloat(last.flux);
                return isNaN(val) ? null : val;
            }

            /* ── Simulation Fallback ── */

            simulateWeather() {
                const t = Date.now() * 0.0001;
                this.data.kp += (Math.random() - 0.5) * 0.4;
                this.data.kp = Math.max(0, Math.min(9, this.data.kp));

                this.data.wind += (Math.random() - 0.5) * 25;
                this.data.wind = Math.max(280, Math.min(850, this.data.wind));

                this.data.bz += (Math.random() - 0.5) * 1.2;
                this.data.bz = Math.max(-15, Math.min(15, this.data.bz));

                this.data.density += (Math.random() - 0.5) * 2;
                this.data.density = Math.max(0.1, Math.min(30, this.data.density));

                this.data.f107 += (Math.random() - 0.5) * 3;
                this.data.f107 = Math.max(60, Math.min(250, this.data.f107));
            }

            /* ── Derived Metrics ── */

            calculateStorm() {
                // Storm intensity: peaks when Kp>4 and Bz is negative (southward IMF)
                const bzFactor = this.data.bz < 0 ? Math.abs(this.data.bz) / 10 : 0;
                this.data.storm = Math.max(0, Math.min(1,
                    (this.data.kp - 3) / 6 + bzFactor * 0.5
                ));

                // Nebula/Ether: density waves + F10.7 solar radio flux
                const densityFactor = Math.min(1, this.data.density / 20);
                const f107Factor = Math.min(1, (this.data.f107 - 70) / 180);
                const pulse = (Math.sin(Date.now() * 0.00008) + 1) / 2;
                this.data.nebula = (densityFactor * 0.6 + f107Factor * 0.4) * (0.5 + pulse * 0.5);
            }

            /* ── UI Update ── */

            updateUI() {
                document.getElementById('kp-val').textContent = this.data.kp.toFixed(1);
                document.getElementById('wind-val').textContent = Math.round(this.data.wind) + ' km/s';
                document.getElementById('bz-val').textContent = this.data.bz.toFixed(1) + ' nT';
                document.getElementById('dens-val').textContent = this.data.density.toFixed(1) + ' p/cm³';
                document.getElementById('f107-val').textContent = Math.round(this.data.f107) + ' SFU';

                const status = document.getElementById('system-status');
                if (this.data.storm > 0.5) {
                    status.textContent = 'GEOMAG STORM';
                    status.style.color = '#ff4e4e';
                } else if (this.data.kp > 5) {
                    status.textContent = 'STORM ALERT';
                    status.style.color = '#ff6b4e';
                } else if (this.data.nebula > 0.6) {
                    status.textContent = 'NEBULA RISE';
                    status.style.color = 'var(--accent-c)';
                } else if (this.data.bz < -5) {
                    status.textContent = 'SOUTHWARD IMF';
                    status.style.color = '#f59e0b';
                } else {
                    status.textContent = 'OPTIMAL';
                    status.style.color = '#a78dff';
                }
            }

            // Target node count based on density — more particles when space is dense
            getTargetNodeCount() {
                const densityMult = 0.6 + (Math.min(1, this.data.density / 15) * 0.8);
                const f107Mult = 0.8 + (Math.min(1, (this.data.f107 - 70) / 150) * 0.4);
                return Math.floor(CONFIG.baseNodeCount * densityMult * f107Mult);
            }
        }

        /* ─── Star Node ─── */
        class Node {
            constructor(w, h, weatherData) {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;

                // Star visual properties
                this.baseRadius = (Math.random() * 2.0 + 0.8) * CONFIG.starScale;
                this.radius = this.baseRadius;
                this.type = Math.random() > 0.65 ? (Math.random() > 0.75 ? 'C' : 'B') : 'A';
                this.phase = Math.random() * Math.PI * 2;
                this.pulse = 0;
                this.twinkleSpeed = 0.5 + Math.random() * 2.0;
                this.brightness = 0.5 + Math.random() * 0.5;

                // Apply initial weather-based color
                this.applyWeatherColor(weatherData);
            }

            applyWeatherColor(ws) {
                // Color temperature shifts with solar wind speed
                // Slow wind (~300 km/s) = cool blue/white
                // Fast wind (~700+ km/s) = warm yellow/orange
                const windNorm = Math.min(1, (ws.wind - 280) / 500);

                if (this.type === 'A') {
                    // ORDER — cool tones, shifts to warmer during fast wind
                    const r = Math.floor(140 + windNorm * 60);
                    const g = Math.floor(140 + windNorm * 20);
                    const b = Math.floor(255 - windNorm * 60);
                    this.color = { r, g, b };
                } else if (this.type === 'B') {
                    // FLUX — pink/magenta, intensifies with Kp
                    const kpBoost = Math.min(1, ws.kp / 6);
                    const r = Math.floor(200 + kpBoost * 55);
                    const g = Math.floor(80 + kpBoost * 40);
                    const b = Math.floor(160 + kpBoost * 40);
                    this.color = { r, g, b };
                } else {
                    // HUB — white, brightens with density
                    const densBoost = Math.min(1, ws.density / 15);
                    const v = Math.floor(200 + densBoost * 55);
                    this.color = { r: v, g: v, b: Math.min(255, v + 20) };
                }
            }

            update(weather, w, h, dt) {
                // Speed multiplier: faster with solar wind, chaotic with storms
                const speedMult = CONFIG.baseSpeed * (weather.wind / 350) * (1 + weather.storm * 0.8);

                // Jitter increases with Kp (chaos factor)
                const jitter = weather.kp * 0.025;
                this.vx += (Math.random() - 0.5) * jitter;
                this.vy += (Math.random() - 0.5) * jitter;

                // Solar wind pushes stars slightly to the right
                this.vx += (weather.wind - 300) * 0.000015;

                // Negative Bz causes turbulent vertical drift
                if (weather.bz < 0) {
                    this.vy += (Math.random() - 0.5) * Math.abs(weather.bz) * 0.005;
                }

                this.x += this.vx * speedMult * dt;
                this.y += this.vy * speedMult * dt;

                // Screen wrap
                if (this.x < -10) this.x = w + 10;
                if (this.x > w + 10) this.x = -10;
                if (this.y < -10) this.y = h + 10;
                if (this.y > h + 10) this.y = -10;

                this.vx *= CONFIG.friction;
                this.vy *= CONFIG.friction;

                // Twinkle
                this.pulse = Math.sin(Date.now() * 0.001 * this.twinkleSpeed + this.phase);

                // Radius pulses more during storms
                const stormPulse = weather.storm > 0.3 ? Math.sin(Date.now() * 0.003 + this.phase) * weather.storm * 0.5 : 0;
                this.radius = this.baseRadius * (1 + this.pulse * 0.15 + stormPulse);

                // Brightness affected by density and nebula
                this.brightness = 0.4 + (weather.density / 20) * 0.3 + this.pulse * 0.15 + weather.nebula * 0.15;
                this.brightness = Math.min(1, Math.max(0.2, this.brightness));
            }
        }

        /* ─── Main Engine ─── */
        class IbonariumEngine {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.weather = new WeatherSystem();
                this.nodes = [];
                this.w = 0;
                this.h = 0;
                this.lastUpdate = Date.now();
                this.lastFrameTime = Date.now();
                this.edges = 0;

                // Smoothed weather for gradual transitions
                this.smooth = {
                    kp: 2, wind: 380, bz: 0, density: 5, f107: 120,
                    storm: 0, nebula: 0
                };

                this.init();
                this.handleResize();
                window.addEventListener('resize', () => this.handleResize());

                // Start weather sync cycle
                this.weather.sync();
                setInterval(() => {
                    this.weather.sync();
                    this.lastUpdate = Date.now();
                }, CONFIG.updateInterval);

                this.loop();
            }

            init() {
                this.w = window.innerWidth;
                this.h = window.innerHeight;
                this.canvas.width = this.w;
                this.canvas.height = this.h;

                for (let i = 0; i < CONFIG.baseNodeCount; i++) {
                    this.nodes.push(new Node(this.w, this.h, this.weather.data));
                }
            }

            handleResize() {
                this.w = window.innerWidth;
                this.h = window.innerHeight;
                this.canvas.width = this.w;
                this.canvas.height = this.h;
            }

            smoothValue(current, target, rate) {
                return current + (target - current) * rate;
            }

            update() {
                const now = Date.now();
                const dt = Math.min(3, (now - this.lastFrameTime) / 16.67); // normalize to ~60fps
                this.lastFrameTime = now;

                // Smooth weather transitions
                const r = 0.03;
                const ws = this.weather.data;
                this.smooth.kp = this.smoothValue(this.smooth.kp, ws.kp, r);
                this.smooth.wind = this.smoothValue(this.smooth.wind, ws.wind, r);
                this.smooth.bz = this.smoothValue(this.smooth.bz, ws.bz, r);
                this.smooth.density = this.smoothValue(this.smooth.density, ws.density, r);
                this.smooth.f107 = this.smoothValue(this.smooth.f107, ws.f107, r);
                this.smooth.storm = this.smoothValue(this.smooth.storm, ws.storm, r);
                this.smooth.nebula = this.smoothValue(this.smooth.nebula, ws.nebula, r);

                // Update node count — add/remove stars based on density
                const targetCount = this.weather.getTargetNodeCount();
                if (this.nodes.length < targetCount) {
                    const toAdd = Math.min(5, targetCount - this.nodes.length);
                    for (let i = 0; i < toAdd; i++) {
                        this.nodes.push(new Node(this.w, this.h, ws));
                    }
                } else if (this.nodes.length > targetCount) {
                    this.nodes.splice(this.nodes.length - Math.min(5, this.nodes.length - targetCount));
                }

                // Update all nodes
                this.nodes.forEach(n => {
                    n.update(this.smooth, this.w, this.h, dt);
                    // Periodically re-tint color based on weather
                    if (Math.random() < 0.005) {
                        n.applyWeatherColor(this.smooth);
                    }
                });

                // Update timer UI
                const timeLeft = Math.max(0, 60 - Math.floor((now - this.lastUpdate) / 1000));
                document.getElementById('update-timer').textContent = `Next update in: ${timeLeft}s`;
            }

            draw() {
                const ws = this.smooth;
                const time = Date.now() * 0.001;

                // ─── BACKGROUND ───
                // Trail fade: less fade = more persistent trails (higher Kp)
                const trailAlpha = Math.max(0.08, 0.35 - (ws.kp * 0.035));

                // Background hue shifts: calm=deep blue, stormy=dark red/purple
                const bgHue = 240 + (ws.storm * 80); // 240 (blue) → 320 (magenta)
                const bgSat = 30 + (ws.nebula * 40);
                const bgLum = 1.5 + (ws.kp * 0.4) + (ws.nebula * 4);

                this.ctx.fillStyle = `hsla(${bgHue}, ${bgSat}%, ${bgLum}%, ${trailAlpha})`;
                this.ctx.fillRect(0, 0, this.w, this.h);

                // ─── NEBULA GLOW ───
                this.drawNebula(time, ws);

                // ─── AURORA EFFECT (during storms) ───
                if (ws.storm > 0.15) {
                    this.drawAurora(time, ws);
                }

                // ─── CONNECTIONS ───
                this.edges = 0;
                const connectionDist = CONFIG.connectionDist + (ws.bz < 0 ? Math.abs(ws.bz) * 8 : 0);

                for (let i = 0; i < this.nodes.length; i++) {
                    const n1 = this.nodes[i];

                    for (let j = i + 1; j < this.nodes.length; j++) {
                        const n2 = this.nodes[j];
                        const dx = n1.x - n2.x;
                        const dy = n1.y - n2.y;
                        const distSq = dx * dx + dy * dy;

                        if (distSq < connectionDist * connectionDist) {
                            const dist = Math.sqrt(distSq);
                            this.edges++;

                            const proximity = 1 - dist / connectionDist;
                            const opacity = proximity * 0.5;

                            // Constellation hub connections
                            const isHub = n1.type === 'C' || n2.type === 'C';

                            if (isHub && dist < connectionDist * 1.4) {
                                const hubOpacity = opacity * 0.5;
                                this.ctx.lineWidth = (1.5 + ws.density * 0.08) * proximity;
                                this.ctx.strokeStyle = `rgba(255, 255, 255, ${hubOpacity})`;
                            } else if (n1.type === 'A' && n2.type === 'A') {
                                this.ctx.lineWidth = 0.4 + ws.density * 0.04;
                                // Color shifts toward red during storms
                                const sr = Math.floor(157 + ws.storm * 80);
                                const sg = Math.floor(138 - ws.storm * 50);
                                const sb = Math.floor(255 - ws.storm * 100);
                                this.ctx.strokeStyle = `rgba(${sr}, ${sg}, ${sb}, ${opacity})`;
                            } else if (n1.type === 'B' && n2.type === 'B') {
                                this.ctx.lineWidth = 0.4 + ws.density * 0.04;
                                this.ctx.strokeStyle = `rgba(255, 90, 181, ${opacity})`;
                            } else {
                                // Mixed connections — influenced by Bz
                                this.ctx.lineWidth = 0.3 + ws.density * 0.03;
                                if (ws.bz < -3) {
                                    this.ctx.strokeStyle = `rgba(255, 200, 100, ${opacity * 0.6})`;
                                } else {
                                    this.ctx.strokeStyle = `rgba(180, 150, 255, ${opacity * 0.25})`;
                                }
                            }

                            this.ctx.beginPath();
                            this.ctx.moveTo(n1.x, n1.y);

                            // Storm adds noise to connection lines
                            if (ws.storm > 0.3 && dist < connectionDist * 0.7) {
                                const mx = (n1.x + n2.x) / 2 + (Math.random() - 0.5) * 12 * ws.storm;
                                const my = (n1.y + n2.y) / 2 + (Math.random() - 0.5) * 12 * ws.storm;
                                this.ctx.quadraticCurveTo(mx, my, n2.x, n2.y);
                            } else {
                                this.ctx.lineTo(n2.x, n2.y);
                            }
                            this.ctx.stroke();
                        }
                    }
                }

                // ─── STARS ───
                for (let i = 0; i < this.nodes.length; i++) {
                    const n = this.nodes[i];
                    const alpha = n.brightness;

                    if (n.type === 'C') {
                        // Hub stars: bright white with strong glow
                        const glowSize = 12 + ws.density * 1.5 + ws.storm * 8;
                        this.ctx.shadowBlur = glowSize;
                        this.ctx.shadowColor = `rgba(200, 220, 255, ${alpha})`;
                        this.ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    } else {
                        // Regular stars
                        const glowSize = 4 + ws.density * 0.5;
                        this.ctx.shadowBlur = glowSize;
                        const c = n.color;
                        this.ctx.shadowColor = `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha * 0.8})`;
                        this.ctx.fillStyle = `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;
                    }

                    this.ctx.beginPath();
                    this.ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Extra glow ring for bright stars during nebula
                    if (n.type === 'C' && ws.nebula > 0.3) {
                        this.ctx.beginPath();
                        this.ctx.arc(n.x, n.y, n.radius * 2.5, 0, Math.PI * 2);
                        this.ctx.fillStyle = `rgba(0, 242, 255, ${ws.nebula * 0.08})`;
                        this.ctx.fill();
                    }
                }

                this.ctx.shadowBlur = 0;

                // ─── UI UPDATES ───
                document.getElementById('nodes-count').textContent =
                    `Nodes: ${this.nodes.length} | Edges: ${this.edges}`;

                // Stability bars
                const total = 100;
                const etherPct = ws.nebula * 40;
                const remaining = total - etherPct;
                const orderRatio = (50 + (ws.bz * 5) - (ws.kp * 2)) / 100;
                const orderPct = Math.max(0, Math.min(remaining, remaining * orderRatio));
                const fluxPct = remaining - orderPct;

                document.getElementById('bar-a').style.width = orderPct + '%';
                document.getElementById('bar-b').style.width = fluxPct + '%';
                document.getElementById('bar-c').style.width = etherPct + '%';
                document.getElementById('stat-a').textContent = orderPct.toFixed(1) + '%';
                document.getElementById('stat-b').textContent = fluxPct.toFixed(1) + '%';
                document.getElementById('stat-c').textContent = etherPct.toFixed(1) + '%';
            }

            drawNebula(time, ws) {
                this.ctx.save();
                this.ctx.globalCompositeOperation = 'screen';

                const ambient = 0.04 + (ws.density * 0.004) + (ws.nebula * 0.12);

                // Two ambient glows
                const g1 = this.ctx.createRadialGradient(
                    this.w * 0.3, this.h * 0.3, 0,
                    this.w * 0.3, this.h * 0.3, this.w * 0.6
                );
                g1.addColorStop(0, `hsla(250, 60%, 15%, ${ambient})`);
                g1.addColorStop(1, 'transparent');

                const g2 = this.ctx.createRadialGradient(
                    this.w * 0.7, this.h * 0.7, 0,
                    this.w * 0.7, this.h * 0.7, this.w * 0.6
                );
                // Second glow shifts hue with solar wind
                const g2hue = 320 + (Math.min(1, (ws.wind - 300) / 400)) * 40;
                g2.addColorStop(0, `hsla(${g2hue}, 60%, 15%, ${ambient})`);
                g2.addColorStop(1, 'transparent');

                this.ctx.fillStyle = g1;
                this.ctx.fillRect(0, 0, this.w, this.h);
                this.ctx.fillStyle = g2;
                this.ctx.fillRect(0, 0, this.w, this.h);

                // Third: ETHER nebula — moves and breathes
                if (ws.nebula > 0.15) {
                    const cx = this.w * (0.5 + Math.sin(time * 0.15) * 0.25);
                    const cy = this.h * (0.5 + Math.cos(time * 0.12) * 0.2);
                    const g3 = this.ctx.createRadialGradient(cx, cy, 0, this.w * 0.5, this.h * 0.5, this.w * 0.7);
                    g3.addColorStop(0, `hsla(180, 70%, 20%, ${ws.nebula * 0.18})`);
                    g3.addColorStop(0.5, `hsla(200, 50%, 12%, ${ws.nebula * 0.08})`);
                    g3.addColorStop(1, 'transparent');
                    this.ctx.fillStyle = g3;
                    this.ctx.fillRect(0, 0, this.w, this.h);
                }

                this.ctx.restore();
            }

            drawAurora(time, ws) {
                this.ctx.save();
                this.ctx.globalCompositeOperation = 'screen';

                // Aurora curtains at the bottom during geomagnetic storms
                const auroraIntensity = ws.storm * 0.15;
                const auroraH = this.h * (0.15 + ws.storm * 0.2);

                for (let i = 0; i < 3; i++) {
                    const yBase = this.h - auroraH * (0.5 + i * 0.3);
                    const gradient = this.ctx.createLinearGradient(0, yBase, 0, this.h);

                    // Green aurora base, purple/red during strong storms
                    const hue = 120 + (ws.storm > 0.5 ? (ws.storm - 0.5) * 200 : 0) + i * 30;
                    gradient.addColorStop(0, 'transparent');
                    gradient.addColorStop(0.3, `hsla(${hue}, 80%, 40%, ${auroraIntensity * 0.4})`);
                    gradient.addColorStop(0.6, `hsla(${hue + 20}, 70%, 30%, ${auroraIntensity * 0.6})`);
                    gradient.addColorStop(1, `hsla(${hue + 40}, 60%, 20%, ${auroraIntensity * 0.2})`);

                    this.ctx.fillStyle = gradient;

                    // Wavy aurora curtain
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, this.h);
                    for (let x = 0; x <= this.w; x += 20) {
                        const wave = Math.sin(x * 0.003 + time * (0.5 + i * 0.3) + i * 2) *
                                     (15 + ws.storm * 25) +
                                     Math.sin(x * 0.007 + time * 0.3) * 8;
                        this.ctx.lineTo(x, yBase + wave);
                    }
                    this.ctx.lineTo(this.w, this.h);
                    this.ctx.closePath();
                    this.ctx.fill();
                }

                this.ctx.restore();
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        /* ─── Uptime Clock ─── */
        const startDate = new Date('2026-01-31T00:00:00');
        function updateUptime() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            const display = document.getElementById('uptime-clock');
            if (display) {
                display.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
            }
        }

        /* ─── Boot ─── */
        window.onload = () => {
            new IbonariumEngine();
            setInterval(updateUptime, 1000);
            updateUptime();
        };
    </script>
</body>
